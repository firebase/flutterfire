name: e2e-web

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-web
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/example/**'
      - '!**/example/integration_test/**'
      - '**/flutterfire_ui/**'
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/example/**'
      - '!**/example/integration_test/**'
      - '**/flutterfire_ui/**'
      - '**.md'
  workflow_call:
    inputs:
      nightly_test_mode:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  web:
    name: web (${{ matrix.suite.name }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.nightly_test_mode && 5 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        # The `tests` app is sharded by product suite so a hang or flake costs
        # one small job instead of the whole run. `integration_test/e2e_test.dart`
        # still aggregates every suite for Windows and local runs.
        suite:
          - name: core
            working_directory: tests
            target: integration_test/shards/core_shard_test.dart
            scope: tests
          - name: firestore
            working_directory: packages/cloud_firestore/cloud_firestore/example
            target: integration_test/e2e_test.dart
            scope: 'cloud_firestore*'
        exclude:
          # Nightly test mode drops the firestore example leg. The entry is
          # repeated in full because matrix `exclude` compares the whole object;
          # only `name` is switched, so outside test mode it matches nothing.
          - suite:
              name: ${{ inputs.nightly_test_mode && 'firestore' || 'none' }}
              working_directory: packages/cloud_firestore/cloud_firestore/example
              target: integration_test/e2e_test.dart
              scope: 'cloud_firestore*'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-flutterfire
        timeout-minutes: 15
        with:
          firebase-tools-version: '15.25.1'
          # Each matrix leg bootstraps only the packages it exercises.
          bootstrap-scope: ${{ matrix.suite.scope }}
      # The ubuntu runner image ships Google Chrome and a chromedriver build
      # that is matched to it — that pairing IS our pinning strategy, so we use
      # the image binaries rather than downloading our own.
      - name: 'Set up Chrome and chromedriver'
        run: |
          echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
      - name: Generate dummy Firebase configs
        run: dart ./.github/workflows/scripts/generate-dummy-firebase-configs.dart
      - name: Firebase Emulator Cache
        id: firebase-emulator-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          # The firebase emulators are pure javascript and java, OS-independent
          enableCrossOsArchive: true
          # Must match the save path exactly
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-v5-${{ env.FIREBASE_TOOLS_VERSION }}
          restore-keys: firebase-emulators-v5-
      - name: Install Cloud Functions dependencies
        # `firebase emulators:exec` does not install these itself (the old
        # start-firebase-emulator.sh wrapper did); without them the functions
        # emulator fails to load the function definitions.
        run: npm ci --prefix .github/workflows/scripts/functions
      - name: 'E2E Tests'
        # Covers booting the emulator suite as well as the tests themselves, since
        # `emulators:exec` now owns both.
        timeout-minutes: 20
        # firebase.json and the emulator rule files live here, so `emulators:exec`
        # has to run from this directory; the test command cds back to the package
        # under test.
        working-directory: ./.github/workflows/scripts
        # Web devices are not supported for the `flutter test` command yet. As a
        # workaround we can use the `flutter drive` command. Tracking issue:
        # https://github.com/flutter/flutter/issues/66264
        # The retry script only retries infrastructure startup failures
        # (timeouts, AppConnectionException, "Failed to exit Chromium"); real
        # test/compile failures fail fast. It also owns the chromedriver
        # lifecycle, so nothing here starts chromedriver.
        # The retry script reads its FLUTTER_DRIVE_* configuration from the
        # environment, which `emulators:exec` passes through to the command.
        env:
          FLUTTER_DRIVE_TARGET: './${{ matrix.suite.target }}'
          FLUTTER_DRIVE_DRIVER: './test_driver/integration_test.dart'
          FLUTTER_DRIVE_EXTRA_ARGS: '--dart-define=CI=true'
          STORAGE_EMULATOR_DEBUG: 'true'
        run: |
          firebase emulators:exec --project flutterfire-e2e-tests "cd ${GITHUB_WORKSPACE}/${{ matrix.suite.working_directory }} && ${GITHUB_WORKSPACE}/.github/workflows/scripts/flutter-drive-web-retry.sh"
      - name: Save Firestore Emulator Cache
        # Branches can read main cache but main cannot read branch cache. Avoid LRU eviction with main-only cache.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # The firebase emulators are pure javascript and java, OS-independent
          enableCrossOsArchive: true
          key: ${{ steps.firebase-emulator-cache.outputs.cache-primary-key }}
          # Must match the restore path exactly
          path: ~/.cache/firebase/emulators

  web-wasm:
    name: web-wasm (${{ matrix.suite.name }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.nightly_test_mode && 5 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        # Same sharding as the `web` job above; see the comment there.
        suite:
          - name: core
            working_directory: tests
            target: integration_test/shards/core_shard_test.dart
            scope: tests
          - name: firestore
            working_directory: packages/cloud_firestore/cloud_firestore/example
            target: integration_test/e2e_test.dart
            scope: 'cloud_firestore*'
        exclude:
          # Nightly test mode drops the firestore example leg. The entry is
          # repeated in full because matrix `exclude` compares the whole object;
          # only `name` is switched, so outside test mode it matches nothing.
          - suite:
              name: ${{ inputs.nightly_test_mode && 'firestore' || 'none' }}
              working_directory: packages/cloud_firestore/cloud_firestore/example
              target: integration_test/e2e_test.dart
              scope: 'cloud_firestore*'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-flutterfire
        timeout-minutes: 15
        with:
          firebase-tools-version: '15.25.1'
          # Each matrix leg bootstraps only the packages it exercises.
          bootstrap-scope: ${{ matrix.suite.scope }}
      # The ubuntu runner image ships Google Chrome and a chromedriver build
      # that is matched to it — that pairing IS our pinning strategy, so we use
      # the image binaries rather than downloading our own.
      - name: 'Set up Chrome and chromedriver'
        run: |
          echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
      - name: Generate dummy Firebase configs
        run: dart ./.github/workflows/scripts/generate-dummy-firebase-configs.dart
      - name: Firebase Emulator Cache
        id: firebase-emulator-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          # The firebase emulators are pure javascript and java, OS-independent
          enableCrossOsArchive: true
          # Must match the save path exactly
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-v5-${{ env.FIREBASE_TOOLS_VERSION }}
          restore-keys: firebase-emulators-v5-
      - name: Install Cloud Functions dependencies
        # `firebase emulators:exec` does not install these itself (the old
        # start-firebase-emulator.sh wrapper did); without them the functions
        # emulator fails to load the function definitions.
        run: npm ci --prefix .github/workflows/scripts/functions
      - name: 'Use WASM index.html'
        working-directory: ${{ matrix.suite.working_directory }}
        run: mv ./web/wasm_index.html ./web/index.html
      - name: 'E2E Tests'
        # Covers booting the emulator suite as well as the tests themselves, since
        # `emulators:exec` now owns both.
        timeout-minutes: 20
        # firebase.json and the emulator rule files live here, so `emulators:exec`
        # has to run from this directory; the test command cds back to the package
        # under test.
        working-directory: ./.github/workflows/scripts
        # Web devices are not supported for the `flutter test` command yet. As a
        # workaround we can use the `flutter drive` command. Tracking issue:
        # https://github.com/flutter/flutter/issues/66264
        # WASM web runs can hang after building but before the test harness
        # connects; the retry script retries only those infrastructure startup
        # failures. It also owns the chromedriver lifecycle, so nothing here
        # starts chromedriver.
        # The retry script reads its FLUTTER_DRIVE_* configuration from the
        # environment, which `emulators:exec` passes through to the command.
        env:
          FLUTTER_DRIVE_TARGET: './${{ matrix.suite.target }}'
          FLUTTER_DRIVE_DRIVER: './test_driver/integration_test.dart'
          FLUTTER_DRIVE_EXTRA_ARGS: '--wasm --dart-define=CI=true'
          FLUTTER_DRIVE_TIMEOUT_SECONDS: '300'
          FLUTTER_DRIVE_MAX_ATTEMPTS: '2'
          STORAGE_EMULATOR_DEBUG: 'true'
        run: |
          firebase emulators:exec --project flutterfire-e2e-tests "cd ${GITHUB_WORKSPACE}/${{ matrix.suite.working_directory }} && ${GITHUB_WORKSPACE}/.github/workflows/scripts/flutter-drive-web-retry.sh"
      - name: Save Firestore Emulator Cache
        # Branches can read main cache but main cannot read branch cache. Avoid LRU eviction with main-only cache.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # The firebase emulators are pure javascript and java, OS-independent
          enableCrossOsArchive: true
          key: ${{ steps.firebase-emulator-cache.outputs.cache-primary-key }}
          # Must match the restore path exactly
          path: ~/.cache/firebase/emulators
