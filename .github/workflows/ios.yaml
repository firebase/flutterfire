name: e2e-iOS

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ios
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/example/**'
      - '!**/example/integration_test/**'
      - '**/flutterfire_ui/**'
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/example/**'
      - '!**/example/integration_test/**'
      - '**/flutterfire_ui/**'
      - '**.md'
  workflow_call:
    inputs:
      nightly_test_mode:
        type: boolean
        default: false

jobs:
  ios:
    name: ios (${{ matrix.suite.name }})
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: ${{ inputs.nightly_test_mode && 5 || 35 }}
    strategy:
      fail-fast: false
      matrix:
        # The `tests` app is sharded by product suite so a hang or flake costs
        # one small job instead of the whole run. `integration_test/e2e_test.dart`
        # still aggregates every suite for Windows and local runs.
        suite:
          - name: core_misc
            working_directory: tests
            target: integration_test/shards/core_misc_shard_test.dart
            scope: tests
          - name: firestore
            working_directory: packages/cloud_firestore/cloud_firestore/example
            target: integration_test/e2e_test.dart
            scope: 'cloud_firestore*'
        exclude:
          # Nightly drops the firestore example leg. The entry is repeated in
          # full because matrix `exclude` compares the whole object; only `name`
          # is switched, so outside nightly it matches nothing.
          - suite:
              name: ${{ inputs.nightly_test_mode && 'firestore' || 'none' }}
              working_directory: packages/cloud_firestore/cloud_firestore/example
              target: integration_test/e2e_test.dart
              scope: 'cloud_firestore*'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Xcode
        # Firebase iOS SDK: minimum Xcode 26.2.
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - uses: ./.github/actions/setup-flutterfire
        with:
          flutter-version: '3.41.9'
          firebase-tools-version: '15.25.1'
          # Each matrix leg bootstraps only the packages it exercises.
          bootstrap-scope: ${{ matrix.suite.scope }}
      - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        name: Xcode Compile Cache
        with:
          # Distinct from the macOS workflow's key: both run on macos-15, so a shared
          # `xcode-cache-${{ runner.os }}` had the two workflows clobbering each other.
          key: xcode-ccache-ios
          save: "${{ github.ref == 'refs/heads/main' }}"
          max-size: 700M
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        name: Pods Cache
        id: pods-cache
        with:
          # Must match the save path exactly
          path: tests/ios/Pods
          # Keyed on the Podfile and the pinned Firebase SDK version, not tests/pubspec.lock:
          # that file is gitignored, so hashFiles() returned an empty string and the key
          # never changed - the cache could never be invalidated.
          key: pods-v4-${{ runner.os }}-ios-${{ hashFiles('tests/ios/Podfile', 'packages/firebase_core/firebase_core/ios/firebase_sdk_version.rb') }}
          restore-keys: pods-v4-${{ runner.os }}-ios-
      - name: Firebase Emulator Cache
        id: firebase-emulator-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          # The firebase emulators are pure javascript and java, OS-independent
          enableCrossOsArchive: true
          # Must match the save path exactly
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-v5-${{ env.FIREBASE_TOOLS_VERSION }}
          # Trailing dash so this never prefix-matches a future version's key
          restore-keys: firebase-emulators-v5-
      - name: Generate dummy Firebase configs
        run: dart ./.github/workflows/scripts/generate-dummy-firebase-configs.dart --firestore-native
      - name: 'Free up space'
        run: |
          sudo rm -rf \
            /usr/local/share/.cache \
            /opt/microsoft/msedge \
            /opt/microsoft/powershell \
            /opt/pipx \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet
          df -h /
      - name: 'Build Application'
        working-directory: ${{ matrix.suite.working_directory }}
        timeout-minutes: 25
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          export CCACHE_FILECLONE=true
          export CCACHE_DEPEND=true
          export CCACHE_INODECACHE=true
          ccache -s
          flutter build ios --no-codesign --simulator --debug --target=./${{ matrix.suite.target }} --dart-define=CI=true
          ccache -s
      - name: Install Cloud Functions dependencies
        # `firebase emulators:exec` does not install these itself (the old
        # start-firebase-emulator.sh wrapper did); without them the functions
        # emulator fails to load the function definitions.
        # Chown the npm cache directory to the runner user to avoid permission issues.
        run: sudo chown -R 501:20 "/Users/runner/.npm" && npm ci --prefix .github/workflows/scripts/functions
      - uses: futureware-tech/simulator-action@e89aa8f93d3aec35083ff49d2854d07f7186f7f5
        id: simulator
        with:
          # List of available simulators: https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md#installed-simulators
          model: "iPhone 16"
      - name: Ensure Simulator Ready
        timeout-minutes: 13
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
          ENSURE_BOOT_IF_NEEDED: "0"
        run: .github/workflows/scripts/ensure-simulator-ready.sh
      - name: 'E2E Tests'
        # firebase.json and the emulator rule files live here, so `emulators:exec`
        # has to run from this directory; the test command cds back to the package
        # under test.
        working-directory: ./.github/workflows/scripts
        # Covers booting the emulator suite as well as the tests themselves, since
        # `emulators:exec` now owns both.
        timeout-minutes: 20
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
          STORAGE_EMULATOR_DEBUG: 'true'
        run: |
          # Uncomment following line to have simulator logs printed out for debugging purposes.
          # xcrun simctl spawn booted log stream --predicate 'eventMessage contains "flutter"' &
          # Once the integration test runner has launched, leave it running rather
          # than starting a second app instance from a retry.
          # `emulators:exec` boots the suite, runs the command and tears the suite
          # down, exiting with the command's exit code.
          firebase emulators:exec --project flutterfire-e2e-tests "cd ${GITHUB_WORKSPACE}/${{ matrix.suite.working_directory }} && flutter test ${{ matrix.suite.target }} -d \"$SIMULATOR\" --timeout 10x --dart-define=CI=true"
      - name: Save Firestore Emulator Cache
        # Branches can read main cache but main cannot read branch cache. Avoid LRU eviction with main-only cache.
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          # The firebase emulators are pure javascript and java, OS-independent
          enableCrossOsArchive: true
          key: ${{ steps.firebase-emulator-cache.outputs.cache-primary-key }}
          # Must match the restore paths exactly
          path: ~/.cache/firebase/emulators
      - name: Save Pods Cache
        # Branches can read main cache but main cannot read branch cache. Avoid LRU eviction with main-only cache.
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}
          # Must match the restore paths exactly
          path: tests/ios/Pods
