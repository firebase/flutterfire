name: reusable-e2e-ios

# The iOS half of the per-product e2e suite: build the example for the
# simulator and run the integration tests on it. Called by every
# `e2e_tests_<product>.yaml` - every product supports iOS.
#
# This job is the repository's Swift Package Manager coverage (`ios-spm`,
# default true); the macOS job is always CocoaPods, so both dependency managers
# stay exercised.

on:
  workflow_call:
    inputs:
      package-path:
        description: >-
          Path of the package under test, e.g.
          'packages/firebase_storage/firebase_storage'. The example app is
          `<package-path>/example` by convention.
        type: string
        required: true
      package-scope:
        description: "Melos glob bootstrapped before the tests, e.g. 'firebase_storage*'."
        type: string
        required: true
      test-target:
        description: 'Integration test entrypoint, relative to the example directory.'
        type: string
        default: 'integration_test/e2e_test.dart'
      native-config-args:
        description: >-
          Arguments for generate-dummy-firebase-configs.dart, e.g.
          '--storage-native' (emulator tier, writes the native config files the
          Android/Xcode builds require) or '--live-tier-plist=messaging' (live
          tier, writes only the placeholder plist so it cannot clobber the
          injected credentials). Empty = plain run.
        type: string
        default: ''
      inject-config-secrets:
        description: >-
          true selects the live tier: the "Inject Firebase config" step writes
          firebase_options.dart / google-services.json from secrets, no emulator
          is started, and the job is fork/dependabot guarded.
        type: boolean
        default: false
      use-firebase-emulators:
        description: >-
          true (default) runs the test command under `firebase emulators:exec`
          with the emulator suite installed and cached. Independent of
          inject-config-secrets since a product can need both: firebase_auth
          tests run against the Auth emulator but its password-policy tests
          call the live REST API, which rejects placeholder credentials.
        type: boolean
        default: true
      storage-emulator-debug:
        description: >-
          Sets STORAGE_EMULATOR_DEBUG on the test steps. firebase_storage only.
        type: boolean
        default: false
      flutter-version:
        description: >-
          Pinned Flutter version. Empty (the default) leaves the job unpinned
          (stable channel), which is what every product uses today.
        type: string
        default: ''
      firebase-tools-version:
        description: 'firebase-tools version. Emulator tier only.'
        type: string
        default: '15.25.1'
      cache-key-suffix:
        description: >-
          Short product token that makes the ccache/Pods cache keys unique, e.g.
          'storage'. Two products sharing a suffix would clobber each other's
          caches, so this is required rather than defaulted.
        type: string
        required: true
      ios-spm:
        description: >-
          true  = iOS builds under Swift Package Manager (the Podfile is removed
                  first, so `flutter build` does not prefer CocoaPods).
          false = iOS stays on CocoaPods and gets a Pods cache, as
                  firebase_crashlytics must (its Xcode project runs
                  "${PODS_ROOT}/FirebaseCrashlytics/run") and as cloud_functions
                  and firebase_performance currently must (Flutter's
                  experimental SPM integration cannot resolve their examples on
                  the CI Xcode).
          The macOS job is always CocoaPods, so both dependency managers stay
          covered either way.
        type: boolean
        default: true
      ios-free-up-space:
        description: >-
          Runs the aggressive `rm -rf` of preinstalled toolchains before the iOS
          build. Only cloud_firestore needs it (its build fills the runner disk).
        type: boolean
        default: false
      nightly_test_mode:
        description: >-
          Passed down from nightly.yaml. Shortens the job timeout to 5 minutes.
        type: boolean
        default: false
    secrets:
      # `required: false` so the emulator-tier callers can omit the `secrets:`
      # block entirely. The live-tier callers declare them as required and pass
      # them through explicitly.
      TESTS_E2E_FIREBASE_OPTIONS_DART:
        required: false
      TESTS_E2E_GOOGLE_SERVICES_JSON:
        required: false

permissions:
  contents: read

jobs:
  ios:
    # Live tier requires the live-project secrets, which fork and dependabot
    # PRs do not receive.
    if: >-
      inputs.inject-config-secrets == false ||
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    permissions:
      contents: read
    runs-on: macos-15
    env:
      # Inputs consumed inside run: scripts are routed through env so their
      # values are data, never shell/template code (zizmor: template-injection).
      PACKAGE_PATH: ${{ inputs.package-path }}
      TEST_TARGET: ${{ inputs.test-target }}
      NATIVE_CONFIG_ARGS: ${{ inputs.native-config-args }}
    timeout-minutes: ${{ inputs.nightly_test_mode && 5 || 60 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # No `xcode-select` pin: use the runner image's default Xcode. Firebase's
      # iOS SDK minimum is 26.2 and every current macos-15 image is at or above
      # it. The pin to exactly 26.2 was the reason SPM resolution kept failing:
      # that toolchain canonicalizes the ephemeral symlink farm Flutter lays out
      # for plugin packages and then looks for the siblings at their real paths
      # ("Could not resolve package dependencies ... ios/firebase_core does not
      # exist"); newer Xcode resolves the same layout. It is also why
      # cloud_functions and firebase_performance are on CocoaPods for now - they
      # can rejoin SPM once the default-Xcode runs prove clean.
      - uses: ./.github/actions/setup-flutterfire
        with:
          node: ${{ inputs.use-firebase-emulators && 'true' || 'false' }}
          java: ${{ inputs.use-firebase-emulators && 'true' || 'false' }}
          flutter-version: ${{ inputs.flutter-version }}
          firebase-tools-version: ${{ inputs.use-firebase-emulators && inputs.firebase-tools-version || '' }}
          bootstrap-scope: ${{ inputs.package-scope }}
      - name: Enable Swift Package Manager for iOS
        # This job is the repository's iOS Swift Package Manager coverage for the
        # product: every plugin the example depends on ships a Package.swift, so
        # the whole app resolves under SPM. The macOS job stays on CocoaPods, so
        # both dependency managers are exercised.
        if: inputs.ios-spm
        run: flutter config --enable-swift-package-manager
      - name: Disable Swift Package Manager for iOS
        # Recent stable Flutter enables SPM by default, which turns intended
        # CocoaPods builds into hybrid ones. This job's CocoaPods coverage is
        # deliberate (ios-spm: false), so opt out explicitly.
        if: ${{ !inputs.ios-spm }}
        run: flutter config --no-enable-swift-package-manager
      - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        name: Xcode Compile Cache
        with:
          # Distinct from every other macos-15 job's key, otherwise the workflows
          # clobber each other's cache.
          key: xcode-ccache-${{ inputs.cache-key-suffix }}-ios
          save: "${{ github.ref == 'refs/heads/main' }}"
          max-size: 700M
      - name: Firebase Emulator Cache
        if: inputs.use-firebase-emulators
        id: firebase-emulator-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          # The firebase emulators are pure javascript and java, OS-independent
          enableCrossOsArchive: true
          # Must match the save path exactly
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-v5-${{ env.FIREBASE_TOOLS_VERSION }}
          # Trailing dash so this never prefix-matches a future version's key
          restore-keys: firebase-emulators-v5-
      - name: Inject Firebase config
        if: inputs.inject-config-secrets
        # The `flutterfire-e2e-tests` project config lives in repository
        # secrets rather than in the tree: this is a public repo and these are
        # live backends. Same shape as `e2e_tests_pipeline.yaml`.
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.TESTS_E2E_FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.TESTS_E2E_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART" ]; then
            echo "::error::TESTS_E2E_FIREBASE_OPTIONS_DART is empty — secrets are unavailable (fork/dependabot PR?). Failing early instead of producing a broken build."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_DART" > "$PACKAGE_PATH/example/lib/firebase_options.dart"
          echo "$GOOGLE_SERVICES_JSON" > "$PACKAGE_PATH/example/android/app/google-services.json"
      - name: Generate Firebase config files
        # The example's Xcode project lists GoogleService-Info.plist in its
        # Resources build phase, so the build fails outright when it is missing.
        # On the live tier the file is a placeholder only - Firebase is
        # initialised from the Dart options injected above, and
        # `--live-tier-plist` writes that one file and nothing else, so it can
        # never clobber the injected credentials.
        if: ${{ !inputs.inject-config-secrets || inputs.native-config-args != '' }}
        run: |
          # shellcheck disable=SC2086 # an argument list: word-splitting is the point
          dart ./.github/workflows/scripts/generate-dummy-firebase-configs.dart $NATIVE_CONFIG_ARGS
      - name: 'Free up space'
        if: inputs.ios-free-up-space
        run: |
          sudo rm -rf \
            /usr/local/share/.cache \
            /opt/microsoft/msedge \
            /opt/microsoft/powershell \
            /opt/pipx \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet
          df -h /
      - name: Prepare iOS project for Swift Package Manager
        # Done here rather than in the repository: the committed Podfile is what
        # CocoaPods users of the example rely on, and `flutter build` prefers
        # CocoaPods whenever a Podfile is present.
        if: inputs.ios-spm
        working-directory: ${{ inputs.package-path }}/example/ios
        run: |
          if [ -f Podfile ]; then pod deintegrate; fi
          rm -f Podfile Podfile.lock
          rm -rf Pods
      - name: Pods Cache
        if: ${{ !inputs.ios-spm }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: pods-cache
        with:
          # Must match the save path exactly
          path: ${{ inputs.package-path }}/example/ios/Pods
          # Keyed on the Podfile and the pinned Firebase SDK version, not on a
          # pubspec.lock: those are gitignored, so hashFiles() returns an empty
          # string and the key could never be invalidated.
          key: pods-v1-${{ runner.os }}-${{ inputs.cache-key-suffix }}-ios-${{ hashFiles(format('{0}/example/ios/Podfile', inputs.package-path), 'packages/firebase_core/firebase_core/ios/firebase_sdk_version.rb') }}
          restore-keys: pods-v1-${{ runner.os }}-${{ inputs.cache-key-suffix }}-ios-
      - name: 'Build Application'
        working-directory: ${{ inputs.package-path }}/example
        timeout-minutes: 25
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          export CCACHE_FILECLONE=true
          export CCACHE_DEPEND=true
          export CCACHE_INODECACHE=true
          ccache -s
          # Flutter's SPM integration (experimental) intermittently resolves a
          # symlinked plugin package at its real path, where the sibling
          # `../firebase_core` path dependency does not exist ("Could not
          # resolve package dependencies"). Retry exactly once, for exactly
          # that error class - anything else fails immediately.
          set +e
          flutter build ios --no-codesign --simulator --debug --target="./$TEST_TARGET" --dart-define=CI=true > build_output.log 2>&1
          BUILD_EXIT=$?
          cat build_output.log
          if [ $BUILD_EXIT -ne 0 ] && grep -q "Could not resolve package dependencies" build_output.log; then
            echo "SPM package resolution race detected; retrying the build once."
            flutter clean > /dev/null
            flutter build ios --no-codesign --simulator --debug --target="./$TEST_TARGET" --dart-define=CI=true
            BUILD_EXIT=$?
          fi
          set -e
          ccache -s
          exit $BUILD_EXIT
      - name: Install Cloud Functions dependencies
        if: inputs.use-firebase-emulators
        # `firebase emulators:exec` does not install these itself (the old
        # start-firebase-emulator.sh wrapper did); without them the functions
        # emulator fails to load the function definitions.
        # Chown the npm cache directory to the runner user to avoid permission issues.
        run: sudo chown -R 501:20 "/Users/runner/.npm" && npm ci --prefix .github/workflows/scripts/functions
      - uses: futureware-tech/simulator-action@e89aa8f93d3aec35083ff49d2854d07f7186f7f5
        id: simulator
        with:
          # List of available simulators: https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md#installed-simulators
          model: "iPhone 16"
      - name: Ensure Simulator Ready
        timeout-minutes: 13
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
          ENSURE_BOOT_IF_NEEDED: "0"
        run: .github/workflows/scripts/ensure-simulator-ready.sh
      - name: 'E2E Tests'
        if: inputs.use-firebase-emulators
        # firebase.json and the emulator rule files live here, so `emulators:exec`
        # has to run from this directory; the test command cds back to the package
        # under test.
        working-directory: ./.github/workflows/scripts
        # Covers booting the emulator suite as well as the tests themselves, since
        # `emulators:exec` now owns both.
        # Fits one cold (15 min) and two warm (10 min) alarm-bounded test
        # attempts plus one simulator recycle.
        timeout-minutes: 45
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
          STORAGE_EMULATOR_DEBUG: ${{ inputs.storage-emulator-debug && 'true' || '' }}
        run: |
          TEST_COMMAND=$(cat <<'EOF'
          cd "${GITHUB_WORKSPACE}/${PACKAGE_PATH}/example"
          # flutter test on Apple simulators may exit 1 (e.g. "Failed to
          # foreground app") even when every test passed - same behaviour the
          # macOS job launders. Check the actual results to decide.
          run_flutter_test() {
            rm -f flutter_test_output.log
            # File redirect, never capture (iOS spawns log streamers that hold
            # a captured pipe open forever). The alarm ($1) bounds the known
            # zero-output hang well below the step timeout.
            perl -e 'alarm shift; exec @ARGV' "$1" \
              flutter test "$TEST_TARGET" -d "$SIMULATOR" --timeout 10x --dart-define=CI=true > flutter_test_output.log 2>&1
            FT_EXIT=$?
            cat flutter_test_output.log
          }
          attempt_failed() {
            { ! grep -Eq '[0-9]+ tests? passed' flutter_test_output.log && ! grep -Eq '[0-9]+ failed' flutter_test_output.log; } \
              || grep -q "Unable to start the app on the device" flutter_test_output.log
          }
          set +e
          # Three bounded attempts. The zero-output hang is in the tool
          # process, not the app or the device: the simulator log shows the
          # app up and serving network traffic while `flutter test` waits
          # forever for the VM service URI its log reader missed. Retries are
          # therefore the effective lever; the first alarm covers the cold
          # build, the later attempts run against a warm build cache.
          run_flutter_test 900
          if attempt_failed; then
            echo "Launch failure - retrying (attempt 2/3)."
            echo "::group::Simulator log around the hang (Runner)"
            perl -e 'alarm shift; exec @ARGV' 90 \
              xcrun simctl spawn "$SIMULATOR" log show --last 16m --style compact \
              --predicate 'process == "Runner" OR eventMessage CONTAINS "Runner"' 2>/dev/null | tail -80 || true
            echo "::endgroup::"
            run_flutter_test 600
          fi
          if attempt_failed; then
            # Last resort: recycle the simulator too, in case the device is
            # the wedged part after all.
            echo "Launch failure - recycling the simulator and retrying (attempt 3/3)."
            xcrun simctl shutdown "$SIMULATOR" 2>/dev/null || true
            xcrun simctl erase "$SIMULATOR" 2>/dev/null || true
            xcrun simctl boot "$SIMULATOR" 2>/dev/null || true
            "${GITHUB_WORKSPACE}/.github/workflows/scripts/ensure-simulator-ready.sh" || true
            run_flutter_test 600
          fi
          # Trust only the runner's own tally, parsed numerically. Substring
          # checks are how '0 tests passed, 1 failed' once laundered into a
          # green job.
          PASSED=$(grep -Eo '[0-9]+ tests? passed' flutter_test_output.log | tail -1 | grep -Eo '^[0-9]+')
          FAILED=$(grep -Eo '[0-9]+ failed' flutter_test_output.log | tail -1 | grep -Eo '^[0-9]+')
          : "${PASSED:=0}"; : "${FAILED:=0}"
          echo "Result tally: passed=$PASSED failed=$FAILED (flutter test exit $FT_EXIT)"
          if [ "$FAILED" -gt 0 ] || [ "$PASSED" -eq 0 ]; then
            exit 1
          fi
          if [ "$FT_EXIT" -ne 0 ]; then
            echo "All $PASSED tests passed; tolerating flutter test exit $FT_EXIT (simulator foreground quirk)."
          fi
          exit 0
          EOF
          )
          # `emulators:exec` boots the suite, runs the command and tears the suite
          # down, exiting with the command's exit code - the laundering above
          # decides whether this step passes.
          firebase emulators:exec --project flutterfire-e2e-tests "$TEST_COMMAND"
      - name: 'E2E Tests'
        if: ${{ !inputs.use-firebase-emulators }}
        working-directory: ${{ inputs.package-path }}/example
        # Fits one cold (15 min) and two warm (10 min) alarm-bounded test
        # attempts plus one simulator recycle.
        timeout-minutes: 45
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: |
          # Same "exit 1 despite all tests passing" laundering as the
          # emulator-tier step above and the macOS job.
          run_flutter_test() {
            rm -f flutter_test_output.log
            # File redirect, never capture (iOS spawns log streamers that hold
            # a captured pipe open forever). The alarm ($1) bounds the known
            # zero-output hang well below the step timeout.
            perl -e 'alarm shift; exec @ARGV' "$1" \
              flutter test "$TEST_TARGET" -d "$SIMULATOR" --timeout 10x --dart-define=CI=true > flutter_test_output.log 2>&1
            FT_EXIT=$?
            cat flutter_test_output.log
          }
          attempt_failed() {
            { ! grep -Eq '[0-9]+ tests? passed' flutter_test_output.log && ! grep -Eq '[0-9]+ failed' flutter_test_output.log; } \
              || grep -q "Unable to start the app on the device" flutter_test_output.log
          }
          set +e
          # Three bounded attempts. The zero-output hang is in the tool
          # process, not the app or the device: the simulator log shows the
          # app up and serving network traffic while `flutter test` waits
          # forever for the VM service URI its log reader missed. Retries are
          # therefore the effective lever; the first alarm covers the cold
          # build, the later attempts run against a warm build cache.
          run_flutter_test 900
          if attempt_failed; then
            echo "Launch failure - retrying (attempt 2/3)."
            echo "::group::Simulator log around the hang (Runner)"
            perl -e 'alarm shift; exec @ARGV' 90 \
              xcrun simctl spawn "$SIMULATOR" log show --last 16m --style compact \
              --predicate 'process == "Runner" OR eventMessage CONTAINS "Runner"' 2>/dev/null | tail -80 || true
            echo "::endgroup::"
            run_flutter_test 600
          fi
          if attempt_failed; then
            # Last resort: recycle the simulator too, in case the device is
            # the wedged part after all.
            echo "Launch failure - recycling the simulator and retrying (attempt 3/3)."
            xcrun simctl shutdown "$SIMULATOR" 2>/dev/null || true
            xcrun simctl erase "$SIMULATOR" 2>/dev/null || true
            xcrun simctl boot "$SIMULATOR" 2>/dev/null || true
            "${GITHUB_WORKSPACE}/.github/workflows/scripts/ensure-simulator-ready.sh" || true
            run_flutter_test 600
          fi
          # Trust only the runner's own tally, parsed numerically. Substring
          # checks are how '0 tests passed, 1 failed' once laundered into a
          # green job.
          PASSED=$(grep -Eo '[0-9]+ tests? passed' flutter_test_output.log | tail -1 | grep -Eo '^[0-9]+')
          FAILED=$(grep -Eo '[0-9]+ failed' flutter_test_output.log | tail -1 | grep -Eo '^[0-9]+')
          : "${PASSED:=0}"; : "${FAILED:=0}"
          echo "Result tally: passed=$PASSED failed=$FAILED (flutter test exit $FT_EXIT)"
          if [ "$FAILED" -gt 0 ] || [ "$PASSED" -eq 0 ]; then
            exit 1
          fi
          if [ "$FT_EXIT" -ne 0 ]; then
            echo "All $PASSED tests passed; tolerating flutter test exit $FT_EXIT (simulator foreground quirk)."
          fi
          exit 0
      - name: Dump crash reports
        # The recurring "Unable to start the app on the device" launch failures
        # give the Flutter tool nothing to print; simulator app crashes land in
        # the host's crash reporter with the real reason. Only runs on failure.
        if: failure()
        run: |
          found=0
          while IFS= read -r report; do
            found=1
            echo "::group::$(basename "$report")"
            head -c 20000 "$report"
            echo
            echo "::endgroup::"
          done < <(find "$HOME/Library/Logs/DiagnosticReports" -name '*.ips' -newermt '-2 hours' 2>/dev/null)
          [ "$found" -eq 1 ] || echo "No crash reports in the last two hours."
      - name: Save Firebase Emulator Cache
        # Branches can read main cache but main cannot read branch cache. Avoid LRU eviction with main-only cache.
        if: ${{ inputs.use-firebase-emulators && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          # The firebase emulators are pure javascript and java, OS-independent
          enableCrossOsArchive: true
          key: ${{ steps.firebase-emulator-cache.outputs.cache-primary-key }}
          # Must match the restore path exactly
          path: ~/.cache/firebase/emulators
      - name: Save Pods Cache
        continue-on-error: true
        # Branches can read main cache but main cannot read branch cache. Avoid LRU eviction with main-only cache.
        if: ${{ !inputs.ios-spm && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}
          # Must match the restore path exactly
          path: ${{ inputs.package-path }}/example/ios/Pods
