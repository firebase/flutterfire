name: e2e-ml-model-downloader

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ml_model_downloader
  cancel-in-progress: true

# Live tier: this product has no emulator, so every job talks to the real
# `flutterfire-e2e-tests` project using the config in repository secrets.
# Fork and dependabot PRs do not get those secrets, so the reusable workflow
# guards every job.
#
# Thin caller: the jobs themselves live in `reusable_e2e_tests.yaml`.
# Path-filtered so it only runs when this product or its dependencies change;
# the nightly workflow_call still runs it unconditionally.
on:
  pull_request:
    paths:
      - 'packages/firebase_ml_model_downloader/**'
      - 'packages/firebase_core/**'
      - '.github/workflows/e2e_tests_ml_model_downloader.yaml'
      - '.github/workflows/reusable_e2e_tests.yaml'
      - '.github/actions/setup-flutterfire/**'
      - '.github/workflows/scripts/**'
  push:
    branches:
      - main
    paths:
      - 'packages/firebase_ml_model_downloader/**'
      - 'packages/firebase_core/**'
      - '.github/workflows/e2e_tests_ml_model_downloader.yaml'
      - '.github/workflows/reusable_e2e_tests.yaml'
      - '.github/actions/setup-flutterfire/**'
      - '.github/workflows/scripts/**'
  workflow_call:
    inputs:
      nightly_test_mode:
        type: boolean
        default: false
    secrets:
      TESTS_E2E_FIREBASE_OPTIONS_DART:
        required: true
      TESTS_E2E_GOOGLE_SERVICES_JSON:
        required: true

permissions:
  contents: read

jobs:
  e2e:
    uses: ./.github/workflows/reusable_e2e_tests.yaml
    with:
      package-path: 'packages/firebase_ml_model_downloader/firebase_ml_model_downloader'
      package-scope: 'firebase_ml_model_downloader*'
      cache-key-suffix: 'ml_model_downloader'
      platform-interface-package: 'firebase_ml_model_downloader_platform_interface'
      web: false
      native-config-args: '--live-tier-plist=ml_model_downloader'
      inject-config-secrets: true
      nightly_test_mode: ${{ inputs.nightly_test_mode == true }}
    secrets:
      TESTS_E2E_FIREBASE_OPTIONS_DART: ${{ secrets.TESTS_E2E_FIREBASE_OPTIONS_DART }}
      TESTS_E2E_GOOGLE_SERVICES_JSON: ${{ secrets.TESTS_E2E_GOOGLE_SERVICES_JSON }}
