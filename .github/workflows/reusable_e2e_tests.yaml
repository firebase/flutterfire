name: reusable-e2e-tests

# One implementation of the per-product e2e suite. The 14 `e2e_tests_<product>.yaml`
# files used to carry a near-identical copy of these jobs (~500 lines each); they
# are now thin callers that only describe *what* to test, while this file
# describes *how*. A fix made here lands for every product at once.
#
# Two tiers, selected by `inject-config-secrets`:
#   * emulator tier (false) - firebase-tools is installed, the emulator suite is
#     cached, and every test command runs under `firebase emulators:exec`.
#     Config files come from `generate-dummy-firebase-configs.dart`.
#   * live tier (true) - the product has no emulator, so jobs talk to the real
#     `flutterfire-e2e-tests` project. Config comes from repository secrets via
#     the "Inject Firebase config" step, Node/Java are skipped where unused, and
#     every job is fork/dependabot guarded because forks do not get the secrets.
# `use-firebase-emulators` is independent of the config source: firebase_auth
# uses secrets AND the emulator suite (its password-policy tests call the live
# REST API, which rejects placeholder credentials).

on:
  workflow_call:
    inputs:
      # --- what to test -------------------------------------------------
      package-path:
        description: >-
          Path of the package under test, e.g.
          'packages/firebase_storage/firebase_storage'. The example app is
          `<package-path>/example` by convention.
        type: string
        required: true
      package-scope:
        description: "Melos glob bootstrapped before the tests, e.g. 'firebase_storage*'."
        type: string
        required: true
      cache-key-suffix:
        description: >-
          Short product token that makes the ccache/Pods cache keys unique, e.g.
          'storage'. Two products sharing a suffix would clobber each other's
          caches, so this is required rather than defaulted.
        type: string
        required: true
      web-package:
        description: >-
          Name of the web implementation package, e.g. 'firebase_storage_web'.
          Only used to build the `web` paths-filter. Empty means the product has
          no web package (firebase_ai).
        type: string
        default: ''
      platform-interface-package:
        description: >-
          Name of the platform interface package, e.g.
          'firebase_storage_platform_interface'. Only used to build the shared
          paths-filter. Empty means the product has none (firebase_ai).
        type: string
        default: ''
      test-target:
        description: 'Integration test entrypoint, relative to the example directory.'
        type: string
        default: 'integration_test/e2e_test.dart'

      # --- platform toggles ---------------------------------------------
      android:
        type: boolean
        default: true
      ios:
        type: boolean
        default: true
      macos:
        type: boolean
        default: true
      web:
        type: boolean
        default: true
      web-wasm:
        description: >-
          Off by default: the wasm job needs `example/web/wasm_index.html`, which
          only cloud_firestore ships among the product examples. Flip it on per
          caller once the example has one.
        type: boolean
        default: false
      windows:
        type: boolean
        default: false

      # --- per-product behaviour ----------------------------------------
      ios-spm:
        description: >-
          true  = iOS builds under Swift Package Manager (the Podfile is removed
                  first, so `flutter build` does not prefer CocoaPods).
          false = iOS stays on CocoaPods and gets a Pods cache, as
                  firebase_crashlytics must (its Xcode project runs
                  "${PODS_ROOT}/FirebaseCrashlytics/run").
          macOS is always CocoaPods, so both dependency managers stay covered.
        type: boolean
        default: true
      ios-free-up-space:
        description: >-
          Runs the aggressive `rm -rf` of preinstalled toolchains before the iOS
          build. Only cloud_firestore needs it (its build fills the runner disk).
        type: boolean
        default: false
      native-config-args:
        description: >-
          Arguments for generate-dummy-firebase-configs.dart, e.g.
          '--storage-native' (emulator tier, writes the native config files the
          Android/Xcode builds require) or '--live-tier-plist=messaging' (live
          tier, writes only the placeholder plist so it cannot clobber the
          injected credentials). Empty = plain run.
        type: string
        default: ''
      inject-config-secrets:
        description: >-
          true selects the live tier: the "Inject Firebase config" step writes
          firebase_options.dart / google-services.json from secrets, no emulator
          is started, and every job (including `changes`) is fork/dependabot
          guarded.
        type: boolean
        default: false
      use-firebase-emulators:
        description: >-
          true (default) runs the test command under `firebase emulators:exec`
          with the emulator suite installed and cached. Independent of
          inject-config-secrets since a product can need both: firebase_auth
          tests run against the Auth emulator but its password-policy tests
          call the live REST API, which rejects placeholder credentials.
        type: boolean
        default: true
      storage-emulator-debug:
        description: >-
          Sets STORAGE_EMULATOR_DEBUG on the test steps. firebase_storage only.
        type: boolean
        default: false

      # --- toolchain / tuning -------------------------------------------
      flutter-version:
        description: >-
          Pinned Flutter version. Empty (the default) leaves Android/web/Windows
          unpinned (stable channel) on every platform,
          which is what every product pins today.
        type: string
        default: ''
      firebase-tools-version:
        description: 'firebase-tools version. Emulator tier only.'
        type: string
        default: '15.25.1'
      web-wasm-drive-timeout:
        description: >-
          FLUTTER_DRIVE_TIMEOUT_SECONDS for the wasm job. Empty uses the retry
          script default (180).
        type: string
        default: ''
      web-wasm-max-attempts:
        description: >-
          FLUTTER_DRIVE_MAX_ATTEMPTS for the wasm job. Empty uses the retry
          script default (4).
        type: string
        default: ''
      nightly_test_mode:
        description: >-
          Passed down from nightly.yaml. Shortens the job timeouts to 5 minutes
          and skips Windows, whose build cannot fit that budget.
        type: boolean
        default: false
    secrets:
      # `required: false` so the emulator-tier callers can omit the `secrets:`
      # block entirely. The live-tier callers declare them as required and pass
      # them through explicitly.
      TESTS_E2E_FIREBASE_OPTIONS_DART:
        required: false
      TESTS_E2E_GOOGLE_SERVICES_JSON:
        required: false

permissions:
  contents: read

jobs:
  # Maps changed paths to affected platforms so a Kotlin-only change runs only
  # the android job, a Swift-only change only ios/macos, etc. Dart code, the
  # tests themselves, firebase_core and CI plumbing affect every platform.
  # Non-PR events (push to main, the nightly workflow_call) always run
  # everything: the filter step is skipped and its empty outputs fall back to
  # 'true' below.
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Live tier requires the live-project secrets, which fork and dependabot
    # PRs do not receive.
    if: >-
      inputs.inject-config-secrets == false ||
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    outputs:
      android: ${{ steps.filter.outputs.android || 'true' }}
      ios: ${{ steps.filter.outputs.ios || 'true' }}
      macos: ${{ steps.filter.outputs.macos || 'true' }}
      web: ${{ steps.filter.outputs.web || 'true' }}
      windows: ${{ steps.filter.outputs.windows || 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        if: github.event_name == 'pull_request'
        id: filter
        with:
          # The optional package entries fall back to a path that cannot exist
          # rather than being omitted: an expression can pick a list *item*, not
          # whether the item is there at all.
          # `packages/*/<name>` avoids needing the product directory as a
          # separate input - plugin package names are unique repo-wide.
          # Both this file and the caller are in `shared`: a change to either
          # must run everything.
          filters: |
            shared: &shared
              - 'packages/firebase_core/**'
              - '${{ inputs.package-path }}/lib/**'
              - '${{ inputs.package-path }}/pubspec.yaml'
              - '${{ inputs.platform-interface-package && format('packages/*/{0}/**', inputs.platform-interface-package) || 'packages/__none__/**' }}'
              - '${{ inputs.package-path }}/example/integration_test/**'
              - '${{ inputs.package-path }}/example/test_driver/**'
              - '${{ inputs.package-path }}/example/lib/**'
              - '${{ inputs.package-path }}/example/pubspec.yaml'
              - '.github/workflows/reusable_e2e_tests.yaml'
              - '.github/workflows/e2e_tests_*.yaml'
              - '.github/actions/setup-flutterfire/**'
              - '.github/workflows/scripts/**'
            android:
              - *shared
              - '${{ inputs.package-path }}/android/**'
              - '${{ inputs.package-path }}/example/android/**'
            ios:
              - *shared
              - '${{ inputs.package-path }}/ios/**'
              - '${{ inputs.package-path }}/darwin/**'
              - '${{ inputs.package-path }}/example/ios/**'
            macos:
              - *shared
              - '${{ inputs.package-path }}/macos/**'
              - '${{ inputs.package-path }}/darwin/**'
              - '${{ inputs.package-path }}/example/macos/**'
            web:
              - *shared
              - '${{ inputs.web-package && format('packages/*/{0}/**', inputs.web-package) || 'packages/__none__/**' }}'
              - '${{ inputs.package-path }}/example/web/**'
            windows:
              - *shared
              - '${{ inputs.package-path }}/windows/**'
              - '${{ inputs.package-path }}/example/windows/**'

  android:
    needs: changes
    if: >-
      inputs.android &&
      needs.changes.outputs.android == 'true' &&
      (inputs.inject-config-secrets == false ||
       github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # Inputs consumed inside run: scripts are routed through env so their
      # values are data, never shell/template code (zizmor: template-injection).
      PACKAGE_PATH: ${{ inputs.package-path }}
      TEST_TARGET: ${{ inputs.test-target }}
      NATIVE_CONFIG_ARGS: ${{ inputs.native-config-args }}
      AVD_ARCH: x86_64
      AVD_API_LEVEL: 34
      AVD_TARGET: google_apis
    timeout-minutes: ${{ inputs.nightly_test_mode && 5 || 35 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-flutterfire
        with:
          # Live tier has no emulator suite, so no firebase-tools and no Node.
          # Java stays: the Gradle build needs it either way.
          node: ${{ inputs.use-firebase-emulators && 'true' || 'false' }}
          flutter-version: ${{ inputs.flutter-version }}
          firebase-tools-version: ${{ inputs.use-firebase-emulators && inputs.firebase-tools-version || '' }}
          bootstrap-scope: ${{ inputs.package-scope }}
      - name: Inject Firebase config
        if: inputs.inject-config-secrets
        # The `flutterfire-e2e-tests` project config lives in repository
        # secrets rather than in the tree: this is a public repo and these are
        # live backends. Same shape as `e2e_tests_pipeline.yaml`.
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.TESTS_E2E_FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.TESTS_E2E_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART" ]; then
            echo "::error::TESTS_E2E_FIREBASE_OPTIONS_DART is empty — secrets are unavailable (fork/dependabot PR?). Failing early instead of producing a broken build."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_DART" > "$PACKAGE_PATH/example/lib/firebase_options.dart"
          echo "$GOOGLE_SERVICES_JSON" > "$PACKAGE_PATH/example/android/app/google-services.json"
      - name: Firebase Emulator Cache
        if: inputs.use-firebase-emulators
        id: firebase-emulator-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          # The firebase emulators are pure javascript and java, OS-independent
          enableCrossOsArchive: true
          # Must match the save path exactly
          path: ~/.cache/firebase/emulators
          # Shared with every other e2e workflow: same emulator payload, same key.
          key: firebase-emulators-v5-${{ env.FIREBASE_TOOLS_VERSION }}
          # Trailing dash so this never prefix-matches a future version's key
          restore-keys: firebase-emulators-v5-
      - name: Generate dummy Firebase configs
        if: ${{ !inputs.inject-config-secrets }}
        # The native flag (e.g. `--storage-native`) is required for products
        # whose example applies the `google-services` plugin: the Android build
        # fails when google-services.json is missing.
        run: |
          # shellcheck disable=SC2086 # an argument list: word-splitting is the point
          dart ./.github/workflows/scripts/generate-dummy-firebase-configs.dart $NATIVE_CONFIG_ARGS
      - name: Install Cloud Functions dependencies
        if: inputs.use-firebase-emulators
        # `firebase emulators:exec` does not install these itself (the old
        # start-firebase-emulator.sh wrapper did); without them the functions
        # emulator fails to load the function definitions.
        run: npm ci --prefix .github/workflows/scripts/functions
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3
      - name: Free Disk Space (Ubuntu)
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793
        with:
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          remove-large-packages: true
      - name: Prepare AVD home on /mnt
        # GitHub-hosted runners mount a ~74GB volume at /mnt. Create it before AVD cache
        # restore and android-emulator-runner (avdmanager needs the space at create time).
        run: |
          sudo mkdir -p /mnt/avd
          sudo chown "$USER:$USER" /mnt/avd
          df -h / /mnt
      - name: AVD cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        id: avd-cache
        with:
          # Must match the save path exactly
          path: |
            /mnt/avd/*
            ~/.android/adb*
          # Deliberately shared across products: every android job wants the same
          # image, so they reuse one copy instead of building their own.
          # The emulator build is part of the key so bumping `emulator-build:` below
          # invalidates the cached AVD instead of reusing an image from the old build.
          key: avd-${{ runner.os }}-${{ env.AVD_API_LEVEL }}-${{ env.AVD_TARGET }}-${{ env.AVD_ARCH }}-14214601
      - name: Link AVD home to /mnt
        # android-emulator-runner exportVariables ANDROID_AVD_HOME to $HOME/.android/avd
        run: |
          mkdir -p "$HOME/.android"
          rm -rf "$HOME/.android/avd"
          ln -s /mnt/avd "$HOME/.android/avd"
      - name: Pre-build APK
        # Build outside the emulator so the AVD does not boot and idle through the
        # whole Gradle build. `flutter test` below reuses this warm build cache.
        working-directory: ${{ inputs.package-path }}/example
        timeout-minutes: 25
        run: flutter build apk --debug --target="$TEST_TARGET" --android-skip-build-dependency-validation
      - name: Start AVD then run E2E tests
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        timeout-minutes: 20
        env:
          ANDROID_AVD_HOME: /mnt/avd
          STORAGE_EMULATOR_DEBUG: ${{ inputs.storage-emulator-debug && 'true' || '' }}
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          emulator-build: 14214601
          # The default (true) wipes and recreates the AVD, making the cache above useless.
          force-avd-creation: false
          # Emulator tier: firebase.json and the emulator rule files live in the
          # scripts directory, so `emulators:exec` has to run from there and the
          # test command cds back to the package under test. `emulators:exec`
          # owns the emulator lifecycle - it boots the suite, runs the command
          # and tears the suite down, exiting with the command's exit code.
          # Live tier: no emulator, so the test runs straight from the example.
          working-directory: ${{ inputs.use-firebase-emulators && '.github/workflows/scripts' || format('{0}/example', inputs.package-path) }}
          script: >-
            ${{ inputs.use-firebase-emulators
            && format('firebase emulators:exec --project flutterfire-e2e-tests "cd {0}/{1}/example && flutter test {2} --timeout 10x --dart-define=CI=true -d emulator-5554"', github.workspace, inputs.package-path, inputs.test-target)
            || format('flutter test {0} --timeout 10x --dart-define=CI=true -d emulator-5554', inputs.test-target) }}
      - name: Ensure Appium is shut down
      # Required because of below issue where emulator failing to shut down properly causes tests to fail
      # https://github.com/ReactiveCircus/android-emulator-runner/issues/385
        run: |
          pgrep -f appium && pkill -f appium || echo "No Appium process found"
      - name: Save Firebase Emulator Cache
        # Branches can read main cache but main cannot read branch cache. Avoid LRU eviction with main-only cache.
        if: ${{ inputs.use-firebase-emulators && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          # The firebase emulators are pure javascript and java, OS-independent
          enableCrossOsArchive: true
          key: ${{ steps.firebase-emulator-cache.outputs.cache-primary-key }}
          # Must match the restore path exactly
          path: ~/.cache/firebase/emulators
      - name: Save Android Emulator Cache
        # Branches can read main cache but main cannot read branch cache. Avoid LRU eviction with main-only cache.
        # Skip on a cache hit: the AVD image is multi-GB and re-uploading it unchanged on
        # every main run is pure waste.
        if: github.ref == 'refs/heads/main' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}
          # Must match the restore path exactly
          path: |
            /mnt/avd/*
            ~/.android/adb*

  ios:
    needs: changes
    if: >-
      inputs.ios &&
      needs.changes.outputs.ios == 'true' &&
      (inputs.inject-config-secrets == false ||
       github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
    permissions:
      contents: read
    runs-on: macos-15
    env:
      # Inputs consumed inside run: scripts are routed through env so their
      # values are data, never shell/template code (zizmor: template-injection).
      PACKAGE_PATH: ${{ inputs.package-path }}
      TEST_TARGET: ${{ inputs.test-target }}
      NATIVE_CONFIG_ARGS: ${{ inputs.native-config-args }}
    timeout-minutes: ${{ inputs.nightly_test_mode && 5 || 35 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Xcode
        # Firebase iOS SDK: minimum Xcode 26.2.
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - uses: ./.github/actions/setup-flutterfire
        with:
          node: ${{ inputs.use-firebase-emulators && 'true' || 'false' }}
          java: ${{ inputs.use-firebase-emulators && 'true' || 'false' }}
          flutter-version: ${{ inputs.flutter-version }}
          firebase-tools-version: ${{ inputs.use-firebase-emulators && inputs.firebase-tools-version || '' }}
          bootstrap-scope: ${{ inputs.package-scope }}
      - name: Enable Swift Package Manager for iOS
        # This job is the repository's iOS Swift Package Manager coverage for the
        # product: every plugin the example depends on ships a Package.swift, so
        # the whole app resolves under SPM. The macOS job stays on CocoaPods, so
        # both dependency managers are exercised.
        if: inputs.ios-spm
        run: flutter config --enable-swift-package-manager
      - name: Disable Swift Package Manager for iOS
        # Recent stable Flutter enables SPM by default, which turns intended
        # CocoaPods builds into hybrid ones. This job's CocoaPods coverage is
        # deliberate (ios-spm: false), so opt out explicitly.
        if: ${{ !inputs.ios-spm }}
        run: flutter config --no-enable-swift-package-manager
      - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        name: Xcode Compile Cache
        with:
          # Distinct from every other macos-15 job's key, otherwise the workflows
          # clobber each other's cache.
          key: xcode-ccache-${{ inputs.cache-key-suffix }}-ios
          save: "${{ github.ref == 'refs/heads/main' }}"
          max-size: 700M
      - name: Firebase Emulator Cache
        if: inputs.use-firebase-emulators
        id: firebase-emulator-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          # The firebase emulators are pure javascript and java, OS-independent
          enableCrossOsArchive: true
          # Must match the save path exactly
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-v5-${{ env.FIREBASE_TOOLS_VERSION }}
          # Trailing dash so this never prefix-matches a future version's key
          restore-keys: firebase-emulators-v5-
      - name: Inject Firebase config
        if: inputs.inject-config-secrets
        # The `flutterfire-e2e-tests` project config lives in repository
        # secrets rather than in the tree: this is a public repo and these are
        # live backends. Same shape as `e2e_tests_pipeline.yaml`.
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.TESTS_E2E_FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.TESTS_E2E_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART" ]; then
            echo "::error::TESTS_E2E_FIREBASE_OPTIONS_DART is empty — secrets are unavailable (fork/dependabot PR?). Failing early instead of producing a broken build."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_DART" > "$PACKAGE_PATH/example/lib/firebase_options.dart"
          echo "$GOOGLE_SERVICES_JSON" > "$PACKAGE_PATH/example/android/app/google-services.json"
      - name: Generate Firebase config files
        # The example's Xcode project lists GoogleService-Info.plist in its
        # Resources build phase, so the build fails outright when it is missing.
        # On the live tier the file is a placeholder only - Firebase is
        # initialised from the Dart options injected above, and
        # `--live-tier-plist` writes that one file and nothing else, so it can
        # never clobber the injected credentials.
        if: ${{ !inputs.inject-config-secrets || inputs.native-config-args != '' }}
        run: |
          # shellcheck disable=SC2086 # an argument list: word-splitting is the point
          dart ./.github/workflows/scripts/generate-dummy-firebase-configs.dart $NATIVE_CONFIG_ARGS
      - name: 'Free up space'
        if: inputs.ios-free-up-space
        run: |
          sudo rm -rf \
            /usr/local/share/.cache \
            /opt/microsoft/msedge \
            /opt/microsoft/powershell \
            /opt/pipx \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet
          df -h /
      - name: Prepare iOS project for Swift Package Manager
        # Done here rather than in the repository: the committed Podfile is what
        # CocoaPods users of the example rely on, and `flutter build` prefers
        # CocoaPods whenever a Podfile is present.
        if: inputs.ios-spm
        working-directory: ${{ inputs.package-path }}/example/ios
        run: |
          if [ -f Podfile ]; then pod deintegrate; fi
          rm -f Podfile Podfile.lock
          rm -rf Pods
      - name: Pods Cache
        if: ${{ !inputs.ios-spm }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: pods-cache
        with:
          # Must match the save path exactly
          path: ${{ inputs.package-path }}/example/ios/Pods
          # Keyed on the Podfile and the pinned Firebase SDK version, not on a
          # pubspec.lock: those are gitignored, so hashFiles() returns an empty
          # string and the key could never be invalidated.
