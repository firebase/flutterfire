name: e2e-database

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-database
  cancel-in-progress: true

# Emulator tier: every job runs under `firebase emulators:exec`, so no live
# project credentials are needed.
#
# Thin caller: one job per platform this product supports, each delegating
# to the matching `reusable_e2e_<platform>.yaml`. Platforms the product does
# not support have no job here, so they render no check at all.
# Path-filtered so it only runs when this product or its dependencies change;
# the nightly workflow_call still runs it unconditionally.
on:
  pull_request:
    paths:
      - 'packages/firebase_database/**'
      - 'packages/firebase_core/**'
      - '.github/workflows/e2e_tests_database.yaml'
      - '.github/workflows/reusable_e2e_*.yaml'
      - '.github/actions/setup-flutterfire/**'
      - '.github/workflows/scripts/**'
  push:
    branches:
      - main
    paths:
      - 'packages/firebase_database/**'
      - 'packages/firebase_core/**'
      - '.github/workflows/e2e_tests_database.yaml'
      - '.github/workflows/reusable_e2e_*.yaml'
      - '.github/actions/setup-flutterfire/**'
      - '.github/workflows/scripts/**'
  workflow_call:
    inputs:
      nightly_test_mode:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/reusable_e2e_changes.yaml
    with:
      package-path: 'packages/firebase_database/firebase_database'
      platform-interface-package: 'firebase_database_platform_interface'
      web-package: 'firebase_database_web'

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/reusable_e2e_android.yaml
    with:
      package-path: 'packages/firebase_database/firebase_database'
      package-scope: 'firebase_database*'
      native-config-args: '--database-native'
      nightly_test_mode: ${{ inputs.nightly_test_mode == true }}

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/reusable_e2e_ios.yaml
    with:
      package-path: 'packages/firebase_database/firebase_database'
      package-scope: 'firebase_database*'
      cache-key-suffix: 'database'
      native-config-args: '--database-native'
      nightly_test_mode: ${{ inputs.nightly_test_mode == true }}

  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    uses: ./.github/workflows/reusable_e2e_macos.yaml
    with:
      package-path: 'packages/firebase_database/firebase_database'
      package-scope: 'firebase_database*'
      cache-key-suffix: 'database'
      native-config-args: '--database-native'
      nightly_test_mode: ${{ inputs.nightly_test_mode == true }}

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/reusable_e2e_web.yaml
    with:
      package-path: 'packages/firebase_database/firebase_database'
      package-scope: 'firebase_database*'
      native-config-args: '--database-native'
      nightly_test_mode: ${{ inputs.nightly_test_mode == true }}
