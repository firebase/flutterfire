name: e2e-auth

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-auth
  cancel-in-progress: true

# Emulator tier: every job runs under `firebase emulators:exec`, so no live
# project credentials are needed.
#
# Thin caller: the jobs themselves live in `reusable_e2e_tests.yaml`.
# Path-filtered so it only runs when this product or its dependencies change;
# the nightly workflow_call still runs it unconditionally.
on:
  pull_request:
    paths:
      - 'packages/firebase_auth/**'
      - 'packages/firebase_core/**'
      - '.github/workflows/e2e_tests_auth.yaml'
      - '.github/workflows/reusable_e2e_tests.yaml'
      - '.github/actions/setup-flutterfire/**'
      - '.github/workflows/scripts/**'
  push:
    branches:
      - main
    paths:
      - 'packages/firebase_auth/**'
      - 'packages/firebase_core/**'
      - '.github/workflows/e2e_tests_auth.yaml'
      - '.github/workflows/reusable_e2e_tests.yaml'
      - '.github/actions/setup-flutterfire/**'
      - '.github/workflows/scripts/**'
  workflow_call:
    inputs:
      nightly_test_mode:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    uses: ./.github/workflows/reusable_e2e_tests.yaml
    with:
      package-path: 'packages/firebase_auth/firebase_auth'
      package-scope: 'firebase_auth*'
      cache-key-suffix: 'auth'
      platform-interface-package: 'firebase_auth_platform_interface'
      web-package: 'firebase_auth_web'
      windows: true
      native-config-args: '--auth-native'
      nightly_test_mode: ${{ inputs.nightly_test_mode == true }}
