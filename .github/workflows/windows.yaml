name: e2e-windows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-windows
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/example/**'
      - '!**/example/integration_test/**'
      - '**/flutterfire_ui/**'
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/example/**'
      - '!**/example/integration_test/**'
      - '**/flutterfire_ui/**'
      - '**.md'
  workflow_call:
    inputs:
      nightly_test_mode:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.nightly_test_mode && 5 || 45 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-flutterfire
        with:
          npm-cache: 'false'
          bootstrap-scope: 'tests cloud_firestore*'
      - name: "Install Tools"
        # Not the composite action's firebase-tools install: that one uses `sudo npm`,
        # which does not exist on the Windows runners.
        run: |
          npm install -g firebase-tools@15.25.1
      - name: "Build Windows (Release)"
        timeout-minutes: 25
        run: cd tests && flutter build windows --release
      - name: "Build Windows (Profile)"
        timeout-minutes: 25
        run: cd tests && flutter build windows --profile
      - name: Install Cloud Functions dependencies
        # `firebase emulators:exec` does not install these itself; without them the
        # functions emulator logs "Failed to load function definition" on every run.
        run: npm ci --prefix .github/workflows/scripts/functions
      - name: Start Firebase Emulator and run tests
        timeout-minutes: 30
        env:
          STORAGE_EMULATOR_DEBUG: 'true'
        run: cd ./.github/workflows/scripts && firebase emulators:exec --project flutterfire-e2e-tests "cd ../../../tests && flutter test .\integration_test\e2e_test.dart -d windows --verbose"

  windows-firestore:
    runs-on: windows-latest
    if: ${{ !inputs.nightly_test_mode }}
    timeout-minutes: ${{ inputs.nightly_test_mode && 5 || 45 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-flutterfire
        with:
          npm-cache: 'false'
          bootstrap-scope: 'tests cloud_firestore*'
      - name: Generate dummy Firebase configs
        run: dart ./.github/workflows/scripts/generate-dummy-firebase-configs.dart
      - name: "Install Tools"
        # Not the composite action's firebase-tools install: that one uses `sudo npm`,
        # which does not exist on the Windows runners.
        run: |
          npm install -g firebase-tools@15.25.1
      - name: Install Cloud Functions dependencies
        # `firebase emulators:exec` does not install these itself; without them the
        # functions emulator logs "Failed to load function definition" on every run.
        run: npm ci --prefix .github/workflows/scripts/functions
      - name: Start Firebase Emulator and run tests
        timeout-minutes: 30
        env:
          STORAGE_EMULATOR_DEBUG: 'true'
        run: |
          cd ./.github/workflows/scripts
          firebase emulators:exec --project flutterfire-e2e-tests "cd ../../../packages/cloud_firestore/cloud_firestore/example && flutter drive --target=.\integration_test\e2e_test.dart --driver=.\test_driver\integration_test.dart -d windows --verbose" 2>&1 | Tee-Object -FilePath output.log
          $exitCode = $LASTEXITCODE
          $output = Get-Content output.log -Raw
          if ($output -match '\[E\]' -or $output -match 'Some tests failed') {
            Write-Error "All tests did not pass. Please check the logs for more information."
            exit 1
          }
          exit $exitCode
