name: e2e-crashlytics

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-crashlytics
  cancel-in-progress: true

# Deliberately CocoaPods on iOS as well as macOS: the example's Xcode project
# runs `"${PODS_ROOT}/FirebaseCrashlytics/run"` as a build phase, and PODS_ROOT
# does not exist under Swift Package Manager.
#
# Thin caller: the jobs themselves live in `reusable_e2e_tests.yaml`.
# Path-filtered so it only runs when this product or its dependencies change;
# the nightly workflow_call still runs it unconditionally.
on:
  pull_request:
    paths:
      - 'packages/firebase_crashlytics/**'
      - 'packages/firebase_core/**'
      - '.github/workflows/e2e_tests_crashlytics.yaml'
      - '.github/workflows/reusable_e2e_tests.yaml'
      - '.github/actions/setup-flutterfire/**'
      - '.github/workflows/scripts/**'
  push:
    branches:
      - main
    paths:
      - 'packages/firebase_crashlytics/**'
      - 'packages/firebase_core/**'
      - '.github/workflows/e2e_tests_crashlytics.yaml'
      - '.github/workflows/reusable_e2e_tests.yaml'
      - '.github/actions/setup-flutterfire/**'
      - '.github/workflows/scripts/**'
  workflow_call:
    inputs:
      nightly_test_mode:
        type: boolean
        default: false
    secrets:
      TESTS_E2E_FIREBASE_OPTIONS_DART:
        required: true
      TESTS_E2E_GOOGLE_SERVICES_JSON:
        required: true

permissions:
  contents: read

jobs:
  e2e:
    uses: ./.github/workflows/reusable_e2e_tests.yaml
    with:
      package-path: 'packages/firebase_crashlytics/firebase_crashlytics'
      package-scope: 'firebase_crashlytics*'
      cache-key-suffix: 'crashlytics'
      platform-interface-package: 'firebase_crashlytics_platform_interface'
      web: false
      ios-spm: false
      native-config-args: '--live-tier-plist=crashlytics'
      inject-config-secrets: true
      nightly_test_mode: ${{ inputs.nightly_test_mode == true }}
    secrets:
      TESTS_E2E_FIREBASE_OPTIONS_DART: ${{ secrets.TESTS_E2E_FIREBASE_OPTIONS_DART }}
      TESTS_E2E_GOOGLE_SERVICES_JSON: ${{ secrets.TESTS_E2E_GOOGLE_SERVICES_JSON }}
