# A Dart web app without Flutter. CI resolves and compiles it with the Dart SDK
# alone, to check that `firebase_common`, `firebase_core_interface` and
# `firebase_core_js` never pull in Flutter again.
name: pure_dart_web
publish_to: none

environment:
  sdk: '^3.10.0'

dependencies:
  firebase_core_interface: ^1.0.0
  firebase_core_js:
    path: ../../packages/firebase_core/firebase_core_js

dependency_overrides:
  firebase_common:
    path: ../../packages/firebase_core/firebase_common
  firebase_core_interface:
    path: ../../packages/firebase_core/firebase_core_interface
