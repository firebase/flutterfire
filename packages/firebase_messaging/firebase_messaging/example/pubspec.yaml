name: firebase_messaging_example
description: Demonstrates how to use the firebase_messaging plugin.
resolution: workspace

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  http: ^1.0.0

dev_dependencies:
  firebase_messaging_platform_interface: ^4.11.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # `integration_test/report_test_results.dart` names each executed test via
  # `package:test_api/hooks.dart`; `any` defers to the version flutter_test pins.
  test_api: any

flutter:
  uses-material-design: true
  config:
    # iOS and macOS build with Swift Package Manager only (no Podfile).
    enable-swift-package-manager: true
