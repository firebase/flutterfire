name: firebase_storage_web
description: The web implementation of firebase_storage
homepage: https://github.com/firebase/flutterfire/tree/main/packages/firebase_storage/firebase_storage_web
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_storage/firebase_storage_web
version: 3.11.15
resolution: workspace

environment:
  sdk: '^3.6.0'
  flutter: '>=3.22.0'

dependencies:
  _flutterfire_internals: ^1.3.79
  async: ^2.5.0
  firebase_core: ^5.1.0
  firebase_core_web: ^4.1.0
  firebase_storage_platform_interface: ^6.0.9
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: '>=0.13.0 <2.0.0'
  meta: ^1.8.0
  web: ^1.0.0

dev_dependencies:
  firebase_core_platform_interface: ^8.1.1
  flutter_test:
    sdk: flutter
  mockito: ^5.0.0

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FirebaseStorageWeb
        fileName: firebase_storage_web.dart
