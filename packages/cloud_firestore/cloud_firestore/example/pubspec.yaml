name: cloud_firestore_example
description: Demonstrates how to use the firestore plugin.
resolution: workspace

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  cloud_firestore: ^7.1.0
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  http: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # `integration_test/report_test_results.dart` names each executed test via
  # `package:test_api/hooks.dart`; `any` defers to the version flutter_test pins.
  test_api: any

flutter:
  uses-material-design: true
  config:
    # iOS and macOS build with Swift Package Manager only (no Podfile).
    enable-swift-package-manager: true
