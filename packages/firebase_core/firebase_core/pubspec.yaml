name: firebase_core
description: Flutter plugin for Firebase Core, enabling connecting to multiple
  Firebase apps.
homepage: https://firebase.google.com/docs/flutter/setup
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_core/firebase_core
version: 5.1.0
resolution: workspace
topics:
  - firebase
  - core

false_secrets:
  - example/**

environment:
  sdk: '^3.10.0'
  flutter: '>=3.38.0'

dependencies:
  firebase_core_interface: ^1.0.0
  firebase_core_platform_interface: ^8.1.1
  firebase_core_web: ^4.1.0
  flutter:
    sdk: flutter
  meta: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.0.0
  plugin_platform_interface: ^2.1.3

flutter:
  # `dartPluginClass` registers the method channel implementation before `main`
  # (and in background isolates the engine starts), as `firebase_core_interface`
  # cannot default to it.
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.firebase.core
        pluginClass: FlutterFirebaseCorePlugin
        dartPluginClass: MethodChannelFirebase
        dartFileName: src/method_channel_registrant.dart
      ios:
        pluginClass: FLTFirebaseCorePlugin
        dartPluginClass: MethodChannelFirebase
        dartFileName: src/method_channel_registrant.dart
      macos:
        pluginClass: FLTFirebaseCorePlugin
        dartPluginClass: MethodChannelFirebase
        dartFileName: src/method_channel_registrant.dart
      web:
        default_package: firebase_core_web
      windows:
        pluginClass: FirebaseCorePluginCApi
        dartPluginClass: MethodChannelFirebase
        dartFileName: src/method_channel_registrant.dart

firebase:
  google_services_gradle_plugin_version: '4.4.4'
  crashlytics_gradle_plugin_version: '3.0.7'
  performance_gradle_plugin_version: '2.0.2'
