name: firebase_core_web
description: The web implementation of firebase_core
homepage: https://github.com/firebase/flutterfire/tree/main/packages/firebase_core/firebase_core_web
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_core/firebase_core_web
version: 4.1.0
resolution: workspace

environment:
  sdk: '^3.10.0'
  flutter: '>=3.38.0'

# The implementation lives in `firebase_core_js`, so that Dart web apps without
# Flutter can use it: a Flutter plugin needs the Flutter SDK constraint above,
# and that constraint alone makes `dart pub get` fail outside Flutter.
dependencies:
  firebase_core_js: ^1.0.0
  # `FirebaseCoreWebPlugin` registers through its `FirebasePlatform`, the one
  # `firebase_core` reads. The release that re-exports `firebase_core_interface`'s
  # `FirebasePlatform` must be a major, so that this constraint excludes older
  # versions, which define their own.
  firebase_core_platform_interface: ^8.1.1
  # Not imported either: the generated web plugin registrant imports it, and
  # an app whose only web plugin is this one has no other path to it.
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  web: ^1.0.0

flutter:
  plugin:
    platforms:
      web:
        # Not `FirebaseCoreWeb`: this class also registers the
        # `flutter-fire-core` version for platform logging.
        pluginClass: FirebaseCoreWebPlugin
        fileName: firebase_core_web.dart
