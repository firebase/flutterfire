name: firebase_crashlytics_example
description: Demonstrates how to use the firebase_crashlytics plugin.
resolution: workspace

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  firebase_analytics: ^13.0.0
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # `integration_test/report_test_results.dart` names each executed test via
  # `package:test_api/hooks.dart`; `any` defers to the version flutter_test pins.
  test_api: any

flutter:
  uses-material-design: true
  config:
    # CocoaPods until this example can use Swift Package Manager: the Xcode projects run Crashlytics scripts from $PODS_ROOT.
    enable-swift-package-manager: false
