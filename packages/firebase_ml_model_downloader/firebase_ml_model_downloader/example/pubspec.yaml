name: firebase_ml_model_downloader_example
description: Demonstrates how to use the firebase_ml_model_downloader plugin.
resolution: workspace

publish_to: 'none'

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.14.0
  firebase_ml_model_downloader: ^0.4.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # `integration_test/report_test_results.dart` names each executed test via
  # `package:test_api/hooks.dart`; `any` defers to the version flutter_test pins.
  test_api: any

flutter:
  uses-material-design: true
