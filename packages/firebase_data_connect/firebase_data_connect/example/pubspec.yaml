name: firebase_data_connect_example
description: 'Firebase Data Connect example app'

publish_to: 'none'

version: 1.0.0+1
resolution: workspace

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_data_connect:
    path: ../

  cupertino_icons: ^1.0.6
  flutter_rating_bar: ^4.0.1
  firebase_app_check: ^0.5.1

dev_dependencies:
  build_runner: ^2.3.3

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  # `integration_test/report_test_results.dart` names each executed test via
  # `package:test_api/hooks.dart`; `any` defers to the version flutter_test pins.
  test_api: any

flutter:
  uses-material-design: true
  config:
    # iOS and macOS build with Swift Package Manager only (no Podfile).
    enable-swift-package-manager: true
