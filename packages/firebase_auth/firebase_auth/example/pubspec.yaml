name: firebase_auth_example
description: Demonstrates how to use the firebase_auth plugin.
resolution: workspace

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  barcode_widget: ^2.0.4
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_facebook_auth: ^7.1.5
  google_sign_in: ^6.1.0
  google_sign_in_dartio: ^0.3.0

dev_dependencies:
  # `test_utils.dart` reaches for IterableExtension when scanning the emulator's
  # oobCode list.
  collection: ^1.15.0
  flutter_test:
    sdk: flutter
  # The e2e suite drives the Auth emulator's REST API directly (clearing users,
  # reading oobCodes and SMS verification codes).
  http: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
