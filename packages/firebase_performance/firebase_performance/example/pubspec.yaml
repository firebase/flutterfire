name: firebase_performance_example
description: Demonstrates how to use the firebase_performance plugin.
version: 0.0.1
resolution: workspace
publish_to: none

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  firebase_core: ^4.14.0
  firebase_performance: ^0.11.5
  flutter:
    sdk: flutter
  http: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # `integration_test/report_test_results.dart` names each executed test via
  # `package:test_api/hooks.dart`; `any` defers to the version flutter_test pins.
  test_api: any

flutter:
  uses-material-design: true
