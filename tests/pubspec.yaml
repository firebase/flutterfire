# ignore_for_file sort_pub_dependencies
name: tests
description: A an app for FlutterFire testing (e2e).
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: '^3.6.0'
  flutter: '>=3.22.0'

dependencies:
  cloud_functions: ^7.0.1
  cloud_functions_platform_interface: ^6.1.1
  cloud_functions_web: ^5.1.15
  collection: ^1.15.0
  firebase_ai: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_analytics_platform_interface: ^6.0.9
  firebase_analytics_web: ^0.6.3+15
  firebase_app_check: ^0.5.1
  firebase_app_check_platform_interface: ^0.5.1+3
  firebase_app_check_web: ^0.3.1+3
  firebase_app_installations: ^0.5.1
  firebase_app_installations_platform_interface: ^0.1.7
  firebase_app_installations_web: ^0.1.9+15
  firebase_auth: ^7.0.1
  firebase_auth_platform_interface: ^9.1.2
  firebase_auth_web: ^6.3.2
  firebase_core: ^5.1.0
  firebase_core_platform_interface: ^8.1.1
  firebase_core_web: ^4.1.0
  firebase_crashlytics: ^6.0.1
  firebase_crashlytics_platform_interface: ^3.9.2
  firebase_database: ^13.0.1
  firebase_database_platform_interface: ^0.4.2+9
  firebase_database_web: ^0.2.9+16
  firebase_messaging: ^17.0.1
  firebase_messaging_platform_interface: ^4.11.1
  firebase_messaging_web: ^4.3.1
  firebase_performance: ^0.12.1
  firebase_remote_config: ^7.0.1
  firebase_remote_config_platform_interface: ^3.0.9
  firebase_remote_config_web: ^1.10.16
  firebase_storage: ^14.0.1
  firebase_storage_platform_interface: ^6.0.9
  firebase_storage_web: ^3.11.15
  flutter:
    sdk: flutter
  http: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # `integration_test/report_test_results.dart` names each executed test via
  # `package:test_api/hooks.dart`; `any` defers to the version flutter_test pins.
  test_api: any

flutter:
  uses-material-design: true
  config:
    # iOS and macOS build with Swift Package Manager only (no Podfile).
    enable-swift-package-manager: true
